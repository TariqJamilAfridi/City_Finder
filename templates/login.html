<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CityFinder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; height: 100vh; }
        .login-card { border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 40px; background: white; text-align: center; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="login-card col-md-5">
            <h1 class="mb-3 text-primary fw-bold">CityFinder</h1>
            <p class="text-muted mb-4">Discover essential locations in your city instantly.</p>
            
            <div id="g_id_onload"
                 data-client_id="{{ client_id }}"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin d-flex justify-content-center" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left">
            </div>
        </div>
    </div>

    <script>
        function handleCredentialResponse(response) {
            fetch('/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') window.location.href = data.redirect;
                else alert('Authentication failed!');
            });
        }
    </script>
</body>
</html>
