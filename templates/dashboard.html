<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CityFinder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        #map { height: 600px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .category-btn { margin: 5px; border-radius: 20px; }
        .result-card { cursor: pointer; transition: transform 0.2s; margin-bottom: 15px;}
        .result-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .results-container { max-height: 600px; overflow-y: auto; }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-map-marker-alt"></i> CityFinder</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">Exploring: <strong>{{ city_name }}</strong></span>
                <img src="{{ user_picture }}" alt="Profile" class="rounded-circle me-2" width="35" height="35">
                <span class="text-white me-3">{{ user_name }}</span>
                <a href="/logout" class="btn btn-sm btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <!-- Left Panel: Controls and Results -->
            <div class="col-md-5">
                <div class="card mb-4 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">What are you looking for?</h5>
                        <div id="categories" class="d-flex flex-wrap">
                            <!-- Categories generated by JS -->
                        </div>
                        
                        <div class="mt-3" id="recent-searches">
                            <small class="text-muted">Recent:</small>
                            {% for search in recent_searches %}
                                <span class="badge bg-secondary ms-1">{{ search }}</span>
                            {% endfor %}
                        </div>
                    </div>
                </div>

                <div id="loading" class="text-center d-none my-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Searching entire city via OpenStreetMap...</p>
                </div>

                <div id="error-message" class="alert alert-danger d-none"></div>

                <div class="results-container pe-2" id="results-list">
                    <p class="text-muted text-center mt-5">Select a category to view locations.</p>
                </div>
            </div>

            <!-- Right Panel: Interactive Map -->
            <div class="col-md-7">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const categories = ["Restaurants", "Mosques", "Banks", "Hospitals", "ATMs", "Petrol stations", "Pharmacies", "Hotels", "Shopping malls", "Schools", "Universities", "Parks", "Bus stations"];
        
        const catContainer = document.getElementById('categories');
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-outline-primary btn-sm category-btn';
            btn.innerText = cat;
            btn.onclick = () => performSearch(cat);
            catContainer.appendChild(btn);
        });

        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        let markers = [];
        let markerGroup = L.featureGroup().addTo(map);

        async function performSearch(category) {
            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('results-list').innerHTML = '';
            document.getElementById('error-message').classList.add('d-none');
            markerGroup.clearLayers();
            markers = [];

            try {
                const response = await fetch(`/api/search?category=${encodeURIComponent(category)}`);
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Failed to fetch data');
                
                displayResults(data, category);
            } catch (error) {
                document.getElementById('error-message').textContent = error.message;
                document.getElementById('error-message').classList.remove('d-none');
            } finally {
                document.getElementById('loading').classList.add('d-none');
            }
        }

        function displayResults(data, category) {
            const container = document.getElementById('results-list');
            if (data.length === 0) {
                container.innerHTML = `<div class="alert alert-info">No ${category} found in the city.</div>`;
                return;
            }

            container.innerHTML = `<p class="text-success fw-bold">Found ${data.length} results for ${category}</p>`;

            data.forEach((place, index) => {
                const marker = L.marker([place.lat, place.lon])
                    .bindPopup(`<strong>${place.name}</strong><br>${place.address}`)
                    .addTo(markerGroup);
                markers.push(marker);

                const card = document.createElement('div');
                card.className = 'card result-card';
                card.innerHTML = `
                    <div class="card-body">
                        <h6 class="card-title fw-bold text-primary">${place.name}</h6>
                        <p class="card-text small text-muted mb-2"><i class="fas fa-map-marker-alt"></i> ${place.address}</p>
                        <a href="https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=%3B${place.lat}%2C${place.lon}" target="_blank" class="btn btn-sm btn-success">Directions</a>
                    </div>
                `;
                
                card.onclick = (e) => {
                    if (e.target.tagName !== 'A') {
                        map.setView([place.lat, place.lon], 16);
                        marker.openPopup();
                    }
                };
                
                container.appendChild(card);
            });

            map.fitBounds(markerGroup.getBounds(), { padding: [50, 50] });
        }
    </script>
</body>
</html>
