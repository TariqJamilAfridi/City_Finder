<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityFinder - Find Places Near You</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .main-container {
            background: white;
            border-radius: 20px;
            margin: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        #map { 
            height: 600px; 
            border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 3px solid #fff;
        }
        
        .category-btn { 
            margin: 5px; 
            border-radius: 25px;
            padding: 8px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid #667eea;
        }
        
        .category-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            background: #667eea !important;
            color: white !important;
        }
        
        .result-card { 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-bottom: 15px;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            overflow: hidden;
        }
        
        .result-card:hover { 
            transform: translateX(5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }
        
        .result-card .card-body {
            padding: 15px;
        }
        
        .results-container { 
            max-height: 600px; 
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .results-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .results-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .results-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        
        .results-container::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }
        
        /* Navbar styling */
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        /* Category section */
        .category-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        /* Distance badge */
        .distance-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }
        
        .distance-badge i {
            margin-right: 4px;
        }
        
        /* Buttons */
        .view-btn, .directions-btn {
            transition: all 0.3s ease;
            font-weight: 500;
            border-radius: 8px;
        }
        
        .view-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        
        .view-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .directions-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
        }
        
        .directions-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
        }
        
        /* Location button */
        .locate-btn {
            position: absolute;
            top: 80px;
            right: 10px;
            z-index: 1000;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .locate-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .locate-btn.enabled {
            background: #38ef7d;
            color: white;
            border-color: #38ef7d;
        }
        
        /* Leaflet routing customization */
        .leaflet-routing-container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        
        .leaflet-routing-alt {
            background: #f8f9fa;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .leaflet-routing-alternatives-container {
            display: none;
        }
        
        /* Custom location marker */
        .user-location-marker {
            background: #667eea;
            border: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
            }
            50% {
                box-shadow: 0 0 25px rgba(102, 126, 234, 0.9);
            }
            100% {
                box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
            }
        }
        
        /* Loading spinner */
        .spinner-border {
            color: #667eea !important;
        }
        
        /* Place name styling */
        .place-name {
            color: #667eea;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        
        /* Address styling */
        .place-address {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        /* Stats badge */
        .stats-badge {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 8px 12px;
            display: inline-block;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        
        /* Welcome section */
        .welcome-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .welcome-section h4 {
            font-weight: 700;
        }
        
        /* Results header */
        .results-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }
        
        /* Quick actions */
        .quick-actions {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2000;
        }
        
        .quick-action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            border: 3px solid #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .quick-action-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }
        
        .quick-action-btn i {
            font-size: 24px;
        }
        
        /* Large icon mode */
        body.large-icons .category-btn {
            font-size: 1.2rem;
            padding: 15px 30px;
        }
        
        body.large-icons .result-card {
            font-size: 1.1rem;
        }
        
        body.large-icons .place-name {
            font-size: 1.4rem;
        }
        
        /* Category icons */
        .category-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }
        
        .category-btn-large {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-width: 150px;
        }
        
        /* Simplified mode */
        body.simplified-mode .results-container {
            font-size: 1.2rem;
        }
        
        body.simplified-mode .btn {
            font-size: 1.1rem;
            padding: 12px 24px;
        }
    </style>
</head>
<body>
    <!-- Quick Actions Sidebar -->
    <div class="quick-actions">
        <div class="quick-action-btn" onclick="toggleSimplifiedMode()" title="Simple Mode">
            <i class="fas fa-text-height"></i>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="#">
                <i class="fas fa-map-marker-alt"></i> CityFinder
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="fas fa-city"></i> <strong>{{ city_name }}</strong>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 main-container">
        <div class="row">
            <!-- Left Panel: Controls and Results -->
            <div class="col-md-5">
                <div class="welcome-section">
                    <h4 class="mb-2"><i class="fas fa-compass"></i> Welcome to CityFinder!</h4>
                    <p class="mb-0">Discover essential locations and services in <strong>{{ city_name }}</strong></p>
                </div>

                <div class="category-section">
                    <h5 class="mb-3"><i class="fas fa-th-large"></i> What are you looking for?</h5>
                    <div id="categories" class="d-flex flex-wrap">
                        <!-- Categories generated by JS -->
                    </div>
                </div>

                <div id="loading" class="text-center d-none my-4">
                    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;"></div>
                    <p class="mt-3 text-muted fw-bold">
                        <i class="fas fa-search"></i> Searching entire city via OpenStreetMap...
                    </p>
                </div>

                <div id="error-message" class="alert alert-danger d-none"></div>

                <div class="results-container" id="results-list">
                    <div class="text-center mt-5" style="opacity: 0.6;">
                        <i class="fas fa-hand-pointer fa-3x mb-3" style="color: #667eea;"></i>
                        <p class="text-muted">Select a category above to discover locations</p>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Interactive Map -->
            <div class="col-md-7">
                <div style="position: relative;">
                    <button class="locate-btn" onclick="getUserLocation()" title="Get my location">
                        <i class="fas fa-crosshairs"></i> My Location
                    </button>
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script>
        // Category data with icons
        const categoryData = {
            "Restaurants": { icon: "🍔", color: "#ff6b6b" },
            "Mosques": { icon: "🕌", color: "#4ecdc4" },
            "Banks": { icon: "🏦", color: "#45b7d1" },
            "Hospitals": { icon: "🏥", color: "#f06292" },
            "ATMs": { icon: "💳", color: "#ab47bc" },
            "Petrol stations": { icon: "⛽", color: "#ff9800" },
            "Pharmacies": { icon: "💊", color: "#26a69a" },
            "Hotels": { icon: "🏨", color: "#5c6bc0" },
            "Shopping malls": { icon: "🛍️", color: "#ec407a" },
            "Schools": { icon: "🏫", color: "#66bb6a" },
            "Universities": { icon: "🎓", color: "#42a5f5" },
            "Parks": { icon: "🌳", color: "#8bc34a" },
            "Bus stations": { icon: "🚌", color: "#ffa726" }
        };
        
        const categories = Object.keys(categoryData);
        
        // Toggle simplified mode
        function toggleSimplifiedMode() {
            document.body.classList.toggle('simplified-mode');
            document.body.classList.toggle('large-icons');
        }
        
        const catContainer = document.getElementById('categories');
        categories.forEach(cat => {
            const data = categoryData[cat];
            const btn = document.createElement('button');
            btn.className = 'btn btn-outline-primary btn-sm category-btn category-btn-large';
            btn.innerHTML = `
                <span class="category-icon">${data.icon}</span>
                <span>${cat}</span>
            `;
            btn.onclick = () => {
                performSearch(cat);
            };
            catContainer.appendChild(btn);
        });

        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        let markers = [];
        let markerGroup = L.featureGroup().addTo(map);
        let userLocation = null;
        let userLocationMarker = null;
        let currentRouting = null;
        
        // Automatically try to get user location when page loads
        window.addEventListener('load', function() {
            setTimeout(() => {
                getUserLocation(true); // Auto-detect silently
            }, 1000);
        });
        
        // Function to calculate distance between two points (Haversine formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in kilometers
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;
            return distance;
        }
        
        // Function to format distance
        function formatDistance(km) {
            if (km < 1) {
                return Math.round(km * 1000) + ' m';
            } else {
                return km.toFixed(1) + ' km';
            }
        }

        async function performSearch(category) {
            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('results-list').innerHTML = '';
            document.getElementById('error-message').classList.add('d-none');
            markerGroup.clearLayers();
            markers = [];

            try {
                const response = await fetch(`/api/search?category=${encodeURIComponent(category)}`);
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Failed to fetch data');
                
                displayResults(data, category);
            } catch (error) {
                document.getElementById('error-message').textContent = error.message;
                document.getElementById('error-message').classList.remove('d-none');
            } finally {
                document.getElementById('loading').classList.add('d-none');
            }
        }

        function displayResults(data, category) {
            const container = document.getElementById('results-list');
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> No ${category} found in the city.
                    </div>`;
                return;
            }

            // Calculate distances if user location is available
            if (userLocation) {
                data.forEach(place => {
                    place.distance = calculateDistance(
                        userLocation[0], userLocation[1],
                        place.lat, place.lon
                    );
                });
                // Sort by distance (nearest first)
                data.sort((a, b) => a.distance - b.distance);
            }

            container.innerHTML = `
                <div class="results-header">
                    <i class="fas fa-check-circle"></i> Found ${data.length} ${category}
                    ${userLocation ? ' <span style="opacity: 0.8;">(sorted by distance)</span>' : ''}
                </div>`;

            data.forEach((place, index) => {
                const marker = L.marker([place.lat, place.lon])
                    .bindPopup(`<strong>${place.name}</strong><br>${place.address}`)
                    .addTo(markerGroup);
                markers.push(marker);

                const distanceHTML = place.distance 
                    ? `<div class="distance-badge">
                         <i class="fas fa-route"></i> ${formatDistance(place.distance)} away
                       </div>` 
                    : '';

                const card = document.createElement('div');
                card.className = 'card result-card';
                card.innerHTML = `
                    <div class="card-body">
                        ${distanceHTML}
                        <h6 class="place-name">
                            <i class="fas fa-map-pin"></i> ${place.name}
                        </h6>
                        <p class="place-address">
                            <i class="fas fa-map-marker-alt"></i> ${place.address}
                        </p>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-primary view-btn flex-grow-1" data-index="${index}">
                                <i class="fas fa-eye"></i> View on Map
                            </button>
                            <button class="btn btn-sm btn-success directions-btn flex-grow-1" data-lat="${place.lat}" data-lon="${place.lon}" data-name="${place.name}">
                                <i class="fas fa-directions"></i> Get Directions
                            </button>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });

            map.fitBounds(markerGroup.getBounds(), { padding: [50, 50] });
            
            // Add click handlers for buttons
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const index = parseInt(btn.dataset.index);
                    const place = data[index];
                    map.setView([place.lat, place.lon], 16);
                    markers[index].openPopup();
                });
            });
            
            document.querySelectorAll('.directions-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const lat = parseFloat(btn.dataset.lat);
                    const lon = parseFloat(btn.dataset.lon);
                    const name = btn.dataset.name;
                    getDirections(lat, lon, name);
                });
            });
        }
        
        function getUserLocation(silent = false) {
            if (navigator.geolocation) {
                if (!silent) {
                    document.querySelector('.locate-btn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Getting location...';
                }
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = [position.coords.latitude, position.coords.longitude];
                        
                        // Remove old marker if exists
                        if (userLocationMarker) {
                            map.removeLayer(userLocationMarker);
                        }
                        
                        // Add custom marker for user location
                        const customIcon = L.divIcon({
                            className: 'user-location-marker',
                            iconSize: [20, 20]
                        });
                        
                        userLocationMarker = L.marker(userLocation, { icon: customIcon })
                            .bindPopup('<strong>You are here!</strong>')
                            .addTo(map);
                        
                        if (!silent) {
                            map.setView(userLocation, 14);
                            userLocationMarker.openPopup();
                        }
                        
                        document.querySelector('.locate-btn').innerHTML = '<i class="fas fa-check-circle"></i> Location Enabled';
                        document.querySelector('.locate-btn').classList.add('enabled');
                        document.querySelector('.locate-btn').style.background = '#38ef7d';
                        document.querySelector('.locate-btn').style.color = 'white';
                        document.querySelector('.locate-btn').style.borderColor = '#38ef7d';
                        
                        console.log('User location set:', userLocation);
                    },
                    (error) => {
                        if (!silent) {
                            alert('Unable to get your location. Please enable location services in your browser settings.');
                        }
                        document.querySelector('.locate-btn').innerHTML = '<i class="fas fa-crosshairs"></i> My Location';
                        console.log('Geolocation error:', error);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                if (!silent) {
                    alert('Geolocation is not supported by your browser.');
                }
            }
        }
        
        function getDirections(destLat, destLon, destName) {
            console.log('getDirections called. UserLocation:', userLocation);
            
            if (!userLocation) {
                // Try to get location first, then retry directions
                if (confirm('Location not detected. Would you like to enable location access now?')) {
                    getUserLocation(false);
                    // Retry after 2 seconds
                    setTimeout(() => {
                        if (userLocation) {
                            getDirections(destLat, destLon, destName);
                        } else {
                            alert('Please click "My Location" button and allow location access to get directions.');
                        }
                    }, 2000);
                }
                return;
            }
            
            // Remove previous routing if exists
            if (currentRouting) {
                map.removeControl(currentRouting);
            }
            
            // Create routing control
            currentRouting = L.Routing.control({
                waypoints: [
                    L.latLng(userLocation[0], userLocation[1]),
                    L.latLng(destLat, destLon)
                ],
                routeWhileDragging: false,
                showAlternatives: false,
                addWaypoints: false,
                lineOptions: {
                    styles: [{color: '#2196F3', opacity: 0.8, weight: 6}]
                },
                createMarker: function(i, waypoint, n) {
                    const isStart = i === 0;
                    const marker = L.marker(waypoint.latLng, {
                        draggable: false,
                        icon: L.icon({
                            iconUrl: isStart 
                                ? 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png'
                                : 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34],
                            shadowSize: [41, 41]
                        })
                    });
                    
                    if (isStart) {
                        marker.bindPopup('<strong>Your Location</strong>');
                    } else {
                        marker.bindPopup(`<strong>${destName}</strong><br>Destination`);
                    }
                    
                    return marker;
                }
            }).addTo(map);
            
            // Listen for route found event
            currentRouting.on('routesfound', function(e) {
                const routes = e.routes;
                const summary = routes[0].summary;
                const distance = (summary.totalDistance / 1000).toFixed(2);
                const time = Math.round(summary.totalTime / 60);
                
                // Create a nice info box at the top of results
                const routeInfo = document.createElement('div');
                routeInfo.className = 'alert alert-success mb-3';
                routeInfo.style.borderRadius = '12px';
                routeInfo.style.border = '2px solid #38ef7d';
                routeInfo.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
                routeInfo.style.color = 'white';
                routeInfo.innerHTML = `
                    <h5 class="mb-3"><i class="fas fa-route"></i> Route to ${destName}</h5>
                    <div class="row text-center">
                        <div class="col-6">
                            <div style="background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px;">
                                <i class="fas fa-road fa-2x mb-2"></i>
                                <h4 class="mb-0">${distance} km</h4>
                                <small>Total Distance</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div style="background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px;">
                                <i class="fas fa-clock fa-2x mb-2"></i>
                                <h4 class="mb-0">~${time} min</h4>
                                <small>Estimated Time</small>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <button class="btn btn-light btn-sm" onclick="clearRoute()">
                            <i class="fas fa-times"></i> Clear Route
                        </button>
                    </div>
                `;
                
                // Insert at the top of results
                const container = document.getElementById('results-list');
                container.insertBefore(routeInfo, container.firstChild);
                
                // Smooth scroll to route info
                routeInfo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                
                // Customize routing container appearance
                setTimeout(() => {
                    const routingContainer = document.querySelector('.leaflet-routing-container');
                    if (routingContainer) {
                        routingContainer.style.maxHeight = '300px';
                        routingContainer.style.overflowY = 'auto';
                    }
                }, 500);
            });
        }
        
        function clearRoute() {
            if (currentRouting) {
                map.removeControl(currentRouting);
                currentRouting = null;
            }
            // Remove route info box
            const routeInfo = document.querySelector('.alert-success');
            if (routeInfo && routeInfo.innerHTML.includes('Route to')) {
                routeInfo.remove();
            }
        }
    </script>
</body>
</html>
